# Non-interactive `sam deploy` config for infra/hosting-template.yaml. Deploying this stack
# only provisions/updates the S3 bucket + CloudFront distribution -- it doesn't push the built
# dashboard itself, see the frontend job in .github/workflows/ci.yml for that.
version = 0.1

[default.deploy.parameters]
stack_name = "allergy-tracker-ui"
region = "ca-central-1"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-ryskqxxopokf"
confirm_changeset = false
# Most commits leave this stack untouched, and CloudFormation rejects the resulting empty
# changeset. The key is the click parameter name behind
# --fail-on-empty-changeset/--no-fail-on-empty-changeset, i.e. `fail_on_empty_changeset`; SAM
# silently ignores an unrecognised key, so `no_fail_on_empty_changeset` here did nothing.
fail_on_empty_changeset = false
